# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP SKF Server-Side Template Injection (OWASP Security Knowledge Framework labs, by Glenn ten Cate, Riccardo ten Cate and the SKF contributors) as an Isoloom spec:
# a Flask (Python 2) error page that formats the requested URL into a Jinja2 template before rendering it (SSTI). The SKF lab folder python/SSTI is
# vendored unchanged in app/ and built by its own Dockerfile through an overlay
# (build/web/Dockerfile) that adds the flag folder /ctf.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: skf-ssti

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.154.0/24, internet: false}

machines:
  web:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 256}
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 5000
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build:
        context: app
        dockerfile: app/Dockerfile.lab

checks:
  - name: the lab answers
    http: http://web:5000/static/css/styles.css
    wait: 120
  - name: the 404 page writes the requested URL into the page
    script: checks/notfound.sh

message: |
  OWASP SKF Server-Side Template Injection answers at {{ machines.web.ports.web.url }}.
  Ask for a page that does not exist and read the error page.
